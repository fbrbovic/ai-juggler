# cargo-deny policy — see https://embarkstudios.github.io/cargo-deny/
# Enforced in CI on every PR (docs/plan/QUALITY.md §6).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[advisories]
ignore = [
    # AJ-E505 (2026-10-13): `paste` reaches us transitively through
    # netstat2's netlink-packet chain. RUSTSEC-2024-0436 is an
    # UNMAINTAINED notice (no soundness or security vulnerability);
    # the crate is macro-only build-time code. Recorded exception —
    # revisit when netstat2 drops the netlink macro dependency.
    "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0370 — proc-macro-error 1.0.4 is unmaintained (build-time
    # proc-macro crate, not a vulnerability). Transitive via gtk3-macros /
    # webkit2gtk in Tauri's Linux webview stack; no fixed release exists
    # upstream. Risk assessed 2026-10-12: compile-time only, zero runtime
    # exposure. Remove when gtk-rs ships an update.
    "RUSTSEC-2024-0370",
]
