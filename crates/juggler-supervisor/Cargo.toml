[package]
name = "juggler-supervisor"
description = "Process supervision and resource management: PTY spawn, lifecycle, health, machine stewardship."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
juggler-adapter = { version = "0.0.1", path = "../juggler-adapter" }
juggler-core = { version = "0.0.1", path = "../juggler-core" }
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", features = ["signal"] }
