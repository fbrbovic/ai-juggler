[package]
name = "juggler-app"
description = "Tauri application shell: commands, events, updater wiring, and the desktop entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
juggler-core = { version = "0.0.1", path = "../juggler-core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = "2.12.3"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
tauri-build = "2.7.2"
