name: ✨ Feature request
description: Propose a capability or improvement
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain — what do you have to do manually today, and why does it hurt? Feature requests anchored in a real workflow get priority.
      placeholder: |
        Today, when I … I have to … which breaks when …
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would "solved" look like?
      description: Your idea of the solution — UI, CLI behavior, workflow. Rough is fine.
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Which harness does this involve?
      multiple: true
      options:
        - Claude Code
        - Codex
        - ZCode
        - Another / future adapter
        - App-level (all harnesses)
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity checks
      options:
        - label: I checked the proposal & spec — this is not already planned or explicitly out of scope
          required: true
        - label: This stays within each tool's terms of service (no login automation, credential sharing, or limit evasion)
          required: true
