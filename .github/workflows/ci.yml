name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lightweight gates while the project is in spec phase.
      # The Rust pipeline (cargo fmt --check, clippy -D warnings, cargo test,
      # cross-platform build matrix) is added together with the first crates
      # in milestone M0/M1.
      - name: Verify documentation files are present and non-empty
        run: |
          set -eu
          fail=0
          for f in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md CHANGELOG.md; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty: $f"
              fail=1
            fi
          done
          exit $fail

      - name: Check markdown files do not contain trailing merge markers
        run: |
          ! grep -rn --include='*.md' -E '^(<<<<<<<|>>>>>>>)( |$)' . \
            --exclude-dir=.git
